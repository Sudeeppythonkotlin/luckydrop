<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:ital,wght@1,800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><title>LuckyDrop Admin</title><meta name="robots" content="noindex"></head><body>
<header class="top"><a class="logo serif" href="index.html">Lucky<span>Drop</span></a><nav><a href="winner.html">Winners</a><a href="rules.html">Rules</a></nav></header>
<main>
 <div class="hero"><h1>Admin</h1><p id="who">Log in with the admin Google account.</p></div>
 <button class="btn" id="login">Continue with Google</button>
 <div id="panel" class="hidden">
  <div class="note" id="count"></div>
  <button class="btn" id="drawBtn" style="margin-top:16px">Run today's draw</button>
  <div class="ticket hidden" id="win" style="margin-top:20px"><div class="tk-head"><small>Winning ticket</small></div>
   <div class="tk-body"><div class="code" id="wcode"></div><p class="sub" id="wwho"></p></div></div>
 </div>
 <p class="msg" id="out"></p>
</main>
<script type="module">
import {auth,db,todayKey} from "./firebase.js";
import {GoogleAuthProvider,signInWithPopup,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {doc,getDoc,setDoc,updateDoc,getDocs,query,collection,where,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const $=id=>document.getElementById(id),day=todayKey();
$("login").onclick=()=>signInWithPopup(auth,new GoogleAuthProvider());
// Builds today's pool: 1 entry per ticket + bonus entries (friend joined, invites, 7-day streaks)
async function build(){
 const t=await getDocs(query(collection(db,"tickets"),where("day","==",day)));
 const by={};t.docs.forEach(d=>by[d.data().uid]={code:d.data().code,w:1});
 (await getDocs(query(collection(db,"referrals"),where("day","==",day)))).docs.forEach(d=>{const x=by[d.data().friend];if(x)x.w++});
 const per={},used=[];
 (await getDocs(query(collection(db,"referrals"),where("referrerUsed","==",false)))).docs.forEach(d=>{
  const r=d.data().referrer,x=by[r];if(!x)return;per[r]=per[r]||0;if(per[r]>=5)return;per[r]++;x.w++;used.push(d.ref)});
 (await getDocs(query(collection(db,"users"),where("lastDay","==",day)))).docs.forEach(d=>{
  const s=d.data().streak,x=by[d.id];if(x&&s>=7&&s%7===0)x.w++});
 const list=Object.values(by),W=list.reduce((a,x)=>a+x.w,0);
 return {n:t.size,list,W,used}}
async function showWinner(c){
 $("wcode").textContent=c;$("win").classList.remove("hidden");$("drawBtn").classList.add("hidden");
 const q=await getDocs(query(collection(db,"entries"),where("day","==",day),where("code","==",c)));
 const e=q.docs[0]&&q.docs[0].data();$("wwho").textContent=e?e.name+" - "+e.email:"Winner details not found"}
onAuthStateChanged(auth,async u=>{if(!u)return;$("login").classList.add("hidden");$("who").textContent=u.email;
 try{const p=await build();$("panel").classList.remove("hidden");$("count").textContent=p.n+" tickets, "+p.W+" entries including bonus";
  const r=await getDoc(doc(db,"results",day));if(r.exists())showWinner(r.data().code)}
 catch(e){$("out").textContent="This account is not the admin."}});
$("drawBtn").onclick=async()=>{
 const p=await build();if(!p.n)return $("out").textContent="No tickets claimed today.";
 if(!confirm("Run today's draw from "+p.W+" entries? This cannot be undone."))return;
 const b=new Uint32Array(1);crypto.getRandomValues(b);let r=b[0]%p.W,c=null;
 for(const x of p.list){if(r<x.w){c=x.code;break}r-=x.w}
 try{await setDoc(doc(db,"results",day),{day,code:c,total:p.n,entries:p.W,drawnAt:serverTimestamp()});
  for(const ref of p.used)await updateDoc(ref,{referrerUsed:true});
  await showWinner(c)}
 catch(e){$("out").textContent="Draw failed. It may already have been done."}};
</script></body></html>
